# Buku Tamu Digital Kampus - Cloud-Native Fullstack
# Nama project dibuat tetap supaya stack yang sama dipakai baik saat
# dijalankan manual maupun saat di-deploy oleh Jenkins.
name: guestbook

services:
  # ---------- Backend: Python REST API ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: guestbook-backend:latest
    container_name: guestbook-backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      DATA_FILE: /var/lib/backend_data/guestbook.json
    volumes:
      # Named Volume: data tamu tetap aman walau kontainer dihapus
      - guestbook-db-data:/var/lib/backend_data
    ports:
      # Dibuka ke host hanya untuk pengujian API (curl / Postman)
      - "5000:5000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------- Frontend: Nginx + Plain HTML/JS ----------
  frontend:
    image: nginx:alpine
    container_name: guestbook-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      # Bind Mount: perubahan index.html langsung terlihat tanpa rebuild
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net

# ---------- Custom Bridge Network ----------
networks:
  app-net:
    driver: bridge

# ---------- Named Volume ----------
volumes:
  guestbook-db-data:
    name: guestbook-db-data