
# Buku Tamu Digital Kampus - Cloud-Native Fullstack
name: guestbook

services:
  # ---------- Backend: Python REST API ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: guestbook-backend:latest
    container_name: guestbook-backend
    restart: unless-stopped

    environment:
      PORT: "5000"
      DATA_FILE: /var/lib/backend_data/guestbook.json

    volumes:
      # Named Volume untuk menyimpan data tamu secara persisten
      - guestbook-db-data:/var/lib/backend_data

    ports:
      - "5000:5000"

    networks:
      - app-net

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------- Frontend: Nginx + HTML/JS ----------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: guestbook-frontend:latest
    container_name: guestbook-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8081:80"

    networks:
      - app-net

    healthcheck:
      test:
        - CMD
        - nginx
        - -t
      interval: 10s
      timeout: 5s
      retries: 3

# ---------- Custom Bridge Network ----------
networks:
  app-net:
    driver: bridge

# ---------- Persistent Named Volume ----------
volumes:
  guestbook-db-data:
    name: guestbook-db-data
